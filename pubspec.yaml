name: mapbox_api
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # ── Location & Maps ─────────────────────────────────────────────────────────
  # flutter_map: ^8.1.1   ← REMOVED (migrated to Google Maps)
  # latlong2: ...         ← REMOVED (google_maps_flutter has its own LatLng)
  google_maps_flutter: ^2.14.0
  geolocator: ^14.0.1
  permission_handler: ^12.0.0+1

  # ── Firebase ─────────────────────────────────────────────────────────────────
  cloud_firestore: ^5.6.8
  firebase_core: ^3.13.1
  firebase_auth: ^5.5.3
  firebase_storage: ^12.4.10
  firebase_app_check: ^0.3.2+10

  # ── Auth ─────────────────────────────────────────────────────────────────────
  google_sign_in: ^6.3.0

  # ── Networking ───────────────────────────────────────────────────────────────
  http: ^1.5.0-beta.2

  # ── State management ─────────────────────────────────────────────────────────
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # ── Reactive streams ─────────────────────────────────────────────────────────
  # Used in map_widget.dart for nested StreamBuilder (favorites + auth)
  rxdart: ^0.28.0

  # ── Storage & utilities ───────────────────────────────────────────────────────
  shared_preferences: ^2.5.3
  image_picker: ^1.2.0
  uuid: ^4.5.1
  url_launcher: ^6.3.2
  change_app_package_name: ^1.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  riverpod_generator: ^2.6.5
  build_runner: ^2.5.4
  custom_lint: ^0.7.6
  riverpod_lint: ^2.6.5

flutter:
  uses-material-design: true

  assets:
    - assets/images/