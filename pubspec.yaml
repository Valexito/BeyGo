name: beygo
description: "Encuentra y reserva parqueos cercanos en tiempo real."
publish_to: 'none'

# version: <semver>+<buildNumber>
# Cada subida nueva a Play Store debe incrementar el buildNumber (después del +).
# El versionName (1.0.0) puede repetirse; el versionCode (buildNumber) NO.
version: 1.0.0+1

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # ── Location & Maps ─────────────────────────────────────────────────────────
  # flutter_map: ^8.1.1   ← REMOVED (migrated to Google Maps)
  # latlong2: ...         ← REMOVED (google_maps_flutter has its own LatLng)
  google_maps_flutter: ^2.14.0
  geolocator: ^14.0.1
  permission_handler: ^12.0.0+1

  # ── Firebase ─────────────────────────────────────────────────────────────────
  cloud_firestore: ^5.6.8
  cloud_functions: ^5.5.1
  firebase_core: ^3.13.1
  firebase_auth: ^5.5.3
  firebase_storage: ^12.4.10
  firebase_app_check: ^0.3.2+10

  # ── Auth ─────────────────────────────────────────────────────────────────────
  google_sign_in: ^6.3.0

  # ── Networking ───────────────────────────────────────────────────────────────
  http: ^1.5.0-beta.2

  # ── State management ─────────────────────────────────────────────────────────
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # ── Reactive streams ─────────────────────────────────────────────────────────
  # Used in map_widget.dart for nested StreamBuilder (favorites + auth)
  rxdart: ^0.28.0

  # ── Storage & utilities ───────────────────────────────────────────────────────
  shared_preferences: ^2.5.3
  image_picker: ^1.2.0
  uuid: ^4.5.1
  url_launcher: ^6.3.2
  change_app_package_name: ^1.5.0
  firebase_messaging: ^15.2.10
  flutter_local_notifications: ^19.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  riverpod_generator: ^2.6.5
  build_runner: ^2.5.4
  custom_lint: ^0.7.6
  riverpod_lint: ^2.6.5
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.6

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/branding/

# ──────────────────────────────────────────────────────────────────────────────
# flutter_launcher_icons
# 1) Coloca tu PNG en assets/branding/icon.png  (1024x1024, sin transparencia)
# 2) Coloca el "foreground" de adaptive icon en assets/branding/icon_foreground.png
#    (1024x1024, contenido centrado en un círculo de seguridad ~660px)
# 3) Corre:  dart run flutter_launcher_icons
# ──────────────────────────────────────────────────────────────────────────────
flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  remove_alpha_ios: true
  image_path: "assets/branding/icon.png"
  min_sdk_android: 23
  adaptive_icon_background: "#1757A0"
  adaptive_icon_foreground: "assets/branding/icon_foreground.png"
  web:
    generate: false

# ──────────────────────────────────────────────────────────────────────────────
# flutter_native_splash
# Coloca el logo en assets/branding/splash.png  (1152x1152 transparente recomendado)
# Corre:  dart run flutter_native_splash:create
# ──────────────────────────────────────────────────────────────────────────────
flutter_native_splash:
  color: "#1757A0"
  image: "assets/branding/splash.png"
  android_12:
    image: "assets/branding/splash.png"
    icon_background_color: "#1757A0"
  android: true
  ios: true
  web: false
